<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                font-size: 2rem;
                transition: all 0.3s ease;
            }

            li {
                list-style: none;
            }

            .container {
                width: 500px;
                margin: 0 auto;
                margin-top: 300px;
                justify-items: center;
                align-content: center;
                text-align: center;
                padding: 20px;
                border: 5px black solid;
                border-radius: 12px;
            }

            .list {
                padding: 10px;
                border: 3px black solid;
                margin: 10px;
                border-radius: 8px;
            }

        </style>
    </head>
    <body>
        
        <div class = "container">
            <ul class = "box-list">
                <li class = "list" id = "basket-ball">Basket Ball</li>
                <li class = "list" id = "foot-ball">Foot Ball</li>
                <li class = "list" id = "volley-ball">Volley Ball</li>
                <li class = "list" id = "swimming-pool">Swimming Pool</li>
            </ul>
        </div>

        <script src = "app.js"></script>
    </body>
</html>
